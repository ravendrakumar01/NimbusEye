# NimbusEye — nginx site.
#
# Installed to /etc/nginx/sites-available/nimbuseye and symlinked into
# sites-enabled by deploy/install.sh. The SERVER_NAME placeholder is substituted
# at install time.
#
# nginx is the only thing that reaches the API: the Go process binds to
# 127.0.0.1, so TLS, the security headers, the rate limits and the ingest-path
# block below cannot be bypassed by hitting the app port directly.

# Rate limit login attempts by IP. Applied to the auth endpoints once session
# authentication exists; harmless until then.
limit_req_zone $binary_remote_addr zone=nimbuseye_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nimbuseye_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAME;

    # certbot replaces these paths when it issues the certificate.
    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nimbuseye_tls:10m;
    ssl_session_timeout 1d;
    # OCSP stapling is deliberately absent: Let's Encrypt no longer publishes an
    # OCSP responder URL, so enabling it only produces a warning at reload.

    # --- Security headers ---------------------------------------------------
    # HSTS is deliberately conservative at first; raise max-age once the
    # certificate renewal loop has been observed working.
    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The UI loads no third-party scripts, fonts or images, so the policy can be
    # this tight. 'unsafe-inline' for style is required by the CSS-in-JS the
    # bundler emits; scripts have no such exemption.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/nimbuseye.access.log;
    error_log  /var/log/nginx/nimbuseye.error.log warn;

    # Authentication is the application's own: session cookies issued by
    # /api/v1/auth/login, enforced by deny-by-default middleware on every route.
    # The interim HTTP basic auth that stood here has been removed.

    # --- Static UI ---------------------------------------------------------
    root /opt/nimbuseye/web;
    index index.html;

    # Hashed asset filenames, so they can be cached indefinitely.
    #
    # `expires` rather than `add_header Cache-Control`: nginx drops all inherited
    # add_header directives the moment a nested block declares one, which silently
    # removed every security header below from these responses.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must not be cached, or a deploy does not take effect until
        # browsers happen to revalidate. `expires -1` for the same reason as
        # above: it does not discard the inherited security headers.
        expires -1;
    }

    # --- API ---------------------------------------------------------------
    # The collector runs on this host and talks to 127.0.0.1 directly. Its ingest
    # endpoints have no business being reachable from the internet, so they are
    # refused here regardless of whether the shared token is known.
    location /api/v1/ingest/ {
        deny all;
        return 404;
    }

    location /api/ {
        limit_req zone=nimbuseye_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Responses are JSON and already small; buffering adds latency for the
        # dashboard's polling requests.
        proxy_buffering off;
    }

    # Reserved for the session endpoints, with a much tighter limit.
    location /api/v1/auth/ {
        limit_req zone=nimbuseye_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated so an external uptime check can use it. It reveals only
    # status, version and mode.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
